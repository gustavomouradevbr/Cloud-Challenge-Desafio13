name: Build and deploy Node.js app to Azure Web App - zoinho3

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        working-directory: ./backend
        run: npm ci

      - name: Build and test
        working-directory: ./backend
        run: |
          npm run build --if-present
          npm run test --if-present

      - name: Prepare deployment package
        run: |
          mkdir -p deploy-package
          cp backend/package.json backend/package-lock.json deploy-package/
          cp -R backend/src backend/public deploy-package/

      - name: Upload deployment package
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: deploy-package/
          if-no-files-found: error

  deploy:
    runs-on: ubuntu-latest
    needs: build

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download deployment package
        uses: actions/download-artifact@v4
        with:
          name: node-app
          path: ./deploy-package

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_4BE962F95FFF4BC78AA7DDDB149BDA43 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_C65F0D0016EB48C696353D55B18B4033 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_0BB40EAB0DF9418A917E212482F9042B }}

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: zoinho3
          slot-name: Production
          package: ./deploy-package
